# ============================================================================
# 宝塔「静态网站」配置 —— HexFront 前端（方案 B：双站分离）
#
# 粘贴位置：宝塔 → 网站 → 你的静态站点 → 设置 → 配置文件
#   把 server 块内原有的 location / 与静态资源相关 location 替换为下面这段。
#
# 前置条件：
#   1) 站点根目录指向「index.html 所在的那一层」（webfront/dist 解包后的内容，不是 dist 本身）
#   2) webfront/dist 里的 index.html 由前端构建产出，见 deploy/build-split.sh
# ============================================================================

index index.html index.htm;
root /www/wwwroot/hexfront-web;

# 前端是 SPA：房间页走 path 路由（/room/XXXX/red），刷新时必须回落到 index.html，
# 否则直接 404。try_files 的三个候选依次是：精确文件、目录、入口页。
location / {
    try_files $uri $uri/ /index.html;
}

# 入口文件不缓存：前端重新发布后浏览器立刻拿到新壳，避免旧 index.html 引用已失效的旧 js
location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
}

# 带内容 hash 的构建产物可以长期缓存（文件名变了才需要重新下载）
location ~* \.(js|mjs|css|woff2?|ttf|eot|png|jpg|jpeg|gif|svg|webp|ico|map)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    access_log off;
    try_files $uri =404;
}

# 压缩：地图瓦片(json/geojson) 体积大，压缩收益明显
gzip on;
gzip_min_length 1k;
gzip_comp_level 5;
gzip_vary on;
gzip_types text/plain text/css application/json application/javascript
           application/x-javascript text/xml application/xml image/svg+xml;

# 注意：宝塔默认配置里「禁止访问的文件」与「禁止目录」两段请保留，不要整块覆盖。
# 静态站不需要 PHP 解析段（location ~ \.php { ... }），若有请删掉。
