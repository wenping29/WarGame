# ============================================================================
# 宝塔「.NET 网站」配置 —— 后端 API + WebSocket（方案 B：前后端分离）
#
# 用法：宝塔面板 → 网站 → hexfront-api → 设置 → 配置文件，把本文件内容
#       粘贴进 server 块（替换面板生成的那份），保存后重载 nginx。
#
# ★★★ 最容易踩的坑：/ws 必须透传 Upgrade / Connection ★★★
#   漏了这两行，房间页会一直停在「连接中」——HTTP 正常但 WebSocket 永远握手失败。
#   （$connection_upgrade 变量由 nginx http 块里的 map 定义；宝塔默认 nginx.conf
#    已自带该 map。若启动报 "unknown variable connection_upgrade"，
#    就把下面两行改成固定值：
#        proxy_set_header Upgrade $http_upgrade;
#        proxy_set_header Connection "upgrade";
#    或在 server 块外补：
#        map $http_upgrade $connection_upgrade { default upgrade; '' close; }
#    ）
#
# ★ 长连接超时必须放宽
#   推演指令是 WebSocket 长连接，默认 proxy_read_timeout 60s 会被 nginx 掐断，
#   表现为「玩一会儿就掉线重连」。这里放宽到 3600s。
#
# ★ 端口
#   下面的 5018 必须与后端实际监听端口一致：
#   后端 publish/appsettings.json 的 "Urls" 键，或 ASPNETCORE_URLS 环境变量
#   （环境变量优先，见 DEPLOY.md 6.1 节）。改了一处就要同步改这里。
# ============================================================================

server {
    listen 80;
    server_name 43.142.147.244:7777;          # ← 改成你的后端域名
    index index.html;

    # 全站转给后端进程（宝塔 .NET 站点管理器启动的 HexFront.Api.dll）
    location / {
        proxy_pass http://127.0.0.1:5018;  # ← 端口与后端监听一致
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ---- WebSocket 升级（房间联机必需）----
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # ---- 长连接超时 ----
        proxy_connect_timeout 60s;
        proxy_read_timeout    3600s;
        proxy_send_timeout    3600s;

        # 禁缓冲：推演指令/房间状态要及时下发，不能攒着
        proxy_buffering off;
    }

    access_log /www/wwwlogs/hexfront-api.log;
    error_log  /www/wwwlogs/hexfront-api.error.log;

    # 上传体积上限（剧本文件等）
    client_max_body_size 200m;
}
