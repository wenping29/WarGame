# ============================================================================
# 宝塔「静态网站」配置 —— 前端（方案 B：前后端分离）
#
# 用法：宝塔面板 → 网站 → hexfront-web → 设置 → 配置文件，把本文件内容
#       粘贴进 server 块（替换面板生成的那份），保存后重载 nginx。
#
# 关键点：
#   1. try_files $uri $uri/ /index.html
#      前端是 path 路由（房间页形如 /room/ABC123/red），直接访问或刷新
#      不会命中任何静态文件，必须回落到 index.html，否则 404。
#   2. 跨域模式下这里**不需要**反代 /api —— 前端直接请求后端域名的绝对地址
#      （见 web/ 里的 .env.production，构建时注入）。
#      若改回同源反代模式，则需加上文末「同源模式」一节的 location /api。
#   3. 静态资源加长缓存 + index.html 不缓存，避免发版后用户拿到旧壳。
# ============================================================================

server {
    listen 80;
    server_name game.example.com;          # ← 改成你的前端域名
    index index.html;
    root /www/wwwroot/hexfront-web;        # ← 改成你的静态站根目录

    # ---- 安全响应头（宝塔 SSL 站点会自动加一部分，这里补齐）----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- 前端路由回落（必须）----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 带 hash 的静态资源可长缓存 ----
    location ~* \.(js|css|png|jpe?g|gif|svg|ico|webp|woff2?|ttf|eot|map)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ---- index.html 不缓存（保证发版立即生效）----
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # ---- gzip ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/javascript application/javascript application/json
               application/xml image/svg+xml font/ttf font/otf;

    # ---- 访问日志（排错时看 4xx/5xx）----
    access_log /www/wwwlogs/hexfront-web.log;
    error_log  /www/wwwlogs/hexfront-web.error.log;

    # =========================================================================
    # 【同源模式备用】如果你决定让静态站反代 /api 和 /ws 到后端（前端用相对路径），
    # 取消下面两段的注释，并把后端地址改成实际的 127.0.0.1:5018。
    #
    # location /api/ {
    #     proxy_pass http://127.0.0.1:5018/api/;
    #     proxy_http_version 1.1;
    #     proxy_set_header Host $host;
    #     proxy_set_header X-Real-IP $remote_addr;
    #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #     proxy_set_header X-Forwarded-Proto $scheme;
    #     proxy_read_timeout 300s;
    # }
    #
    # location /ws {
    #     proxy_pass http://127.0.0.1:5018/ws;
    #     proxy_http_version 1.1;
    #     proxy_set_header Upgrade $http_upgrade;
    #     proxy_set_header Connection $connection_upgrade;
    #     proxy_set_header Host $host;
    #     proxy_read_timeout 3600s;
    # }
    # =========================================================================
}
