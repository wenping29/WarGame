# ============================================================================
# 宝塔「.NET 网站」/ 反向代理站点配置 —— HexFront 后端（方案 B：双站分离）
#
# 粘贴位置：宝塔 → 网站 → 你的 .NET 站点（或反向代理站点）→ 设置 → 配置文件
#   把 server 块内原有的 proxy 相关 location 替换为下面这段。
#
# 上游端口 = /srv/hexfront/hexfront.env 里的 ASPNETCORE_URLS 端口（默认 5018）。
# 后端只监听 127.0.0.1:5018，公网流量统一由 nginx 转发，便于上 SSL。
#
# 宝塔的「.NET 网站」本身也是 nginx 反代到 Kestrel 进程，面板已生成类似配置；
# 此时重点核对两件事：
#   1) /ws 是否透传了 Upgrade / Connection 头（不写就会握手失败，表现为房间连不上）
#   2) proxy_read_timeout 是否够长（推演会话是长连接，默认 60s 会被 nginx 掐断）
# ============================================================================

location /api/ {
    proxy_pass http://127.0.0.1:5018;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# WebSocket /ws：Upgrade 与 Connection 头必须透传，否则握手直接被拒
location /ws {
    proxy_pass http://127.0.0.1:5018;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # 推演房间是长连接，超时必须放宽，否则每分钟断一次
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# 其余路径（健康检查等）也交给后端
location / {
    proxy_pass http://127.0.0.1:5018;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
}

# 后端已启用 CORS（HF_ALLOWED_ORIGINS 白名单），nginx 不要再重复加 CORS 响应头，
# 重复叠加会变成 "origin1, origin2"，浏览器判定为非法值而拒绝。
